<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة التحكم | Digital Abonnement</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
/* ================= ADMIN PANEL STYLES ================= */
:root{
  --bg:#060912;--panel:#0b1120;--panel-2:#101829;--border:rgba(255,255,255,.08);
  --text:#e8edf7;--muted:#8b96b0;--em:#10b981;--cy:#22d3ee;--danger:#f43f5e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
h1,h2,h3,b,.btn,summary{font-family:'Cairo',sans-serif}
button{font-family:inherit}
.app{display:grid;grid-template-columns:240px 1fr;height:100vh}

.side{background:var(--panel);border-left:1px solid var(--border);padding:1.3rem .9rem;display:flex;flex-direction:column;gap:.25rem;overflow:auto}
.brand{display:flex;align-items:center;gap:.6rem;font-family:'Cairo';font-weight:900;font-size:1.1rem;padding:.2rem .6rem 1.2rem}
.brand i{width:11px;height:11px;border-radius:50%;background:var(--em);box-shadow:0 0 12px var(--em);flex-shrink:0}
.brand small{display:block;font-size:.75rem;color:var(--muted);font-weight:600}
.tab{display:flex;align-items:center;gap:.7rem;width:100%;padding:.75rem .9rem;border-radius:12px;border:1px solid transparent;background:none;color:var(--muted);font-size:.98rem;font-weight:600;cursor:pointer;text-align:right;transition:.2s;white-space:nowrap}
.tab:hover{color:var(--text);background:rgba(255,255,255,.03)}
.tab.active{color:var(--text);background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(34,211,238,.1));border-color:rgba(34,211,238,.25)}
.tab span{font-size:1.1rem}
.side-foot{margin-top:auto;padding:.8rem;font-size:.82rem;color:var(--muted);line-height:1.6;border-top:1px solid var(--border)}

.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:.5rem;padding:.8rem 1.3rem;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap}
.top h1{font-size:1.15rem;margin-inline-end:auto}
.status{font-size:.82rem;color:var(--muted);margin-inline-end:.6rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1rem;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-weight:700;font-size:.88rem;cursor:pointer;transition:.2s;white-space:nowrap}
.btn:hover{border-color:rgba(34,211,238,.4)}
.btn.primary{background:linear-gradient(135deg,var(--em),var(--cy));color:#03140f;border:none}
.btn.primary:hover{box-shadow:0 6px 20px rgba(16,185,129,.35)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:.35rem .7rem;font-size:.8rem}
.btn.add{width:100%;justify-content:center;border-style:dashed;padding:.8rem;color:var(--cy);margin-top:.6rem}

.work{flex:1;display:grid;grid-template-columns:minmax(400px,1fr) 1.2fr;min-height:0}
.work.no-preview{grid-template-columns:1fr}
.work.no-preview .preview{display:none}
.editor{overflow:auto;padding:1.3rem 1.3rem 4rem}
.editor-inner{max-width:820px;margin-inline:auto}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:1.2rem 1.2rem .6rem;margin-bottom:1.1rem}
.panel h3{font-size:1.02rem;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.panel h3 em{font-style:normal;font-size:.8rem;color:var(--muted);font-weight:600}
.f{display:block;margin-bottom:.85rem}
.f>span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.35rem;font-weight:500}
.f small,.hint{display:block;color:#6b7690;font-size:.78rem;margin-top:.3rem}
input[type=text],input[type=number],textarea,select{
  width:100%;padding:.65rem .8rem;border-radius:10px;border:1px solid var(--border);
  background:#070c18;color:var(--text);font-family:'Tajawal';font-size:.95rem;transition:border-color .2s;
}
input[type=range]{width:100%;accent-color:var(--cy);cursor:pointer}
.rv{color:var(--cy);margin-inline-start:.4rem}
textarea{resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.g2,.g3{display:grid;gap:0 .8rem}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.color{display:flex;gap:.5rem}
.color input[type=color]{width:46px;height:42px;padding:3px;border-radius:10px;border:1px solid var(--border);background:#070c18;cursor:pointer;flex-shrink:0}
.chk{display:flex;align-items:center;gap:.5rem;margin-bottom:.9rem;cursor:pointer;font-weight:600;font-size:.92rem}
.chk input{width:18px;height:18px;accent-color:var(--em);flex-shrink:0}

/* Logo uploader */
.logo-up{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
.logo-prev{width:180px;height:180px;border-radius:18px;border:1px solid var(--border);display:grid;place-items:center;flex-shrink:0;overflow:hidden;
  background:repeating-conic-gradient(#182134 0 25%,#0c1322 0 50%) 0 0/20px 20px}
.logo-prev img{max-width:88%;max-height:88%;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.logo-prev span{color:var(--muted);font-size:.85rem}
.logo-ctrl{flex:1;min-width:220px}
.logo-ctrl .row{display:flex;gap:.5rem;flex-wrap:wrap}

.item{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;margin-bottom:.6rem;overflow:hidden}
.item[open]{border-color:rgba(34,211,238,.25)}
.item summary{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;cursor:pointer;list-style:none;user-select:none}
.item summary::-webkit-details-marker{display:none}
.item summary::before{content:"◂";color:var(--muted);transition:transform .2s;font-size:.8rem}
.item[open] summary::before{transform:rotate(-90deg)}
.item summary b{flex:1;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item summary .meta{font-size:.8rem;color:var(--muted)}
.item .off{font-size:.72rem;color:var(--danger);border:1px solid var(--danger);border-radius:6px;padding:0 .4rem}
.acts{display:flex;gap:.25rem}
.acts button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#070c18;color:var(--muted);cursor:pointer;font-size:.85rem}
.acts button:hover{color:var(--text);border-color:var(--cy)}
.acts button.danger:hover,.acts button.armed{color:#fff;background:var(--danger);border-color:var(--danger)}
.item-body{padding:.4rem .9rem .3rem;border-top:1px solid var(--border)}
.row-item{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem}
.row-item input{flex:1}

.img-row{display:flex;gap:.8rem;align-items:flex-start}
.thumb{width:110px;height:72px;border-radius:10px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;background:#070c18}
.thumb.empty{display:grid;place-items:center;font-size:.75rem;color:var(--muted)}
.img-ctrl{flex:1;display:flex;flex-direction:column;gap:.45rem}
.img-ctrl .row{display:flex;gap:.4rem}

.preview{border-right:1px solid var(--border);display:flex;flex-direction:column;background:#02040a;min-width:0}
.pv-bar{display:flex;align-items:center;gap:.4rem;padding:.55rem .8rem;border-bottom:1px solid var(--border);background:var(--panel)}
.pv-bar b{font-size:.88rem;margin-inline-end:auto;display:flex;align-items:center;gap:.4rem}
.pv-bar b i{width:8px;height:8px;border-radius:50%;background:var(--em);box-shadow:0 0 8px var(--em)}
.pv-bar .btn.on{border-color:var(--cy);color:var(--cy)}
.pv-stage{flex:1;display:flex;justify-content:center;min-height:0;overflow:hidden}
.pv-stage iframe{width:100%;height:100%;border:0;background:#05070f;transition:width .35s ease}
.preview.mobile iframe{width:390px;border-inline:1px solid var(--border)}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120px);background:var(--panel-2);border:1px solid rgba(34,211,238,.35);padding:.8rem 1.4rem;border-radius:12px;font-weight:600;z-index:200;transition:transform .35s ease;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.show{transform:translate(-50%,0)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:150;padding:1rem}
.modal.open{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:min(900px,100%);padding:1.2rem;display:flex;flex-direction:column;gap:.8rem;max-height:90vh}
.modal-box textarea{flex:1;min-height:50vh;font-family:monospace;font-size:.8rem;direction:ltr;text-align:left}
.modal-box .row{display:flex;gap:.5rem;justify-content:flex-end}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#1c2740;border-radius:9px}

@media (max-width:1050px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;padding:.5rem;border-left:0;border-bottom:1px solid var(--border);overflow-x:auto}
  .brand,.side-foot{display:none}
  .tab{width:auto;padding:.55rem .8rem;font-size:.88rem}
  .main{height:auto;min-height:0}
  .work{grid-template-columns:1fr}
  .work:not(.no-preview) .preview{position:fixed;inset:0;z-index:100}
  .g3{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){
  .g2,.g3{grid-template-columns:1fr}
  .top h1{width:100%}
  .editor{padding:1rem .8rem 4rem}
}
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="side">
    <div class="brand"><i></i><div>Digital Abonnement<small>لوحة التحكم</small></div></div>
    <div class="side-foot">
      عدّل المحتوى ← شوف المعاينة ← اضغط <b>«تحميل الموقع»</b> وارفع ملف <b>index.html</b> على GitHub.
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <h1 id="tabTitle"></h1>
      <span class="status" id="status"></span>
      <button class="btn" id="btnPreview">👁️ المعاينة</button>
      <button class="btn" id="btnImport">📂 استيراد</button>
      <button class="btn" id="btnExport">💾 نسخة احتياطية</button>
      <button class="btn danger" id="btnReset" data-confirm>↺ إعادة الضبط</button>
      <button class="btn" id="btnCopy">📋 نسخ الكود</button>
      <button class="btn primary" id="btnDownload">⬇ تحميل الموقع (index.html)</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden />
    </header>

    <div class="work" id="work">
      <div class="editor"><div class="editor-inner" id="editor"></div></div>
      <div class="preview" id="preview">
        <div class="pv-bar">
          <b><i></i> معاينة مباشرة</b>
          <button class="btn sm on" data-device="desktop">💻</button>
          <button class="btn sm" data-device="mobile">📱</button>
          <button class="btn sm" id="pvClose">✕</button>
        </div>
        <div class="pv-stage"><iframe id="frame" title="معاينة الموقع"></iframe></div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="codeModal">
  <div class="modal-box">
    <b>انسخ هذا الكود واحفظه في ملف باسم index.html (بترميز UTF-8)</b>
    <textarea id="codeOut" readonly></textarea>
    <div class="row">
      <button class="btn primary" id="modalCopy">📋 نسخ</button>
      <button class="btn" id="modalClose">إغلاق</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

const clone = o => JSON.parse(JSON.stringify(o));
let cfg = clone(DEFAULTS);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const get = p => p.split(".").reduce((o, k) => (o == null ? undefined : o[k]), cfg);
const set = (p, v) => { const ks = p.split("."); const last = ks.pop(); ks.reduce((o, k) => o[k], cfg)[last] = v; };
function merge(d, s) {
  if (Array.isArray(d)) return Array.isArray(s) ? s : d;
  if (d && typeof d === "object") { const o = {}; for (const k in d) o[k] = merge(d[k], s ? s[k] : undefined); return o; }
  return s === undefined ? d : s;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2800); }

function fillTemplate(tpl, p) {
  return String(tpl || "")
    .replace(/\{name\}/g, p.name || "").replace(/\{tag\}/g, p.tag || "")
    .replace(/\{price\}/g, p.price == null ? "" : p.price).replace(/\{period\}/g, p.period || "");
}

function buildSite(c, preview) {

/* ==========================================================
   5. FORM BUILDERS
   ========================================================== */
const openSet = new Set();
const g2 = (...a) => `<div class="g2">${a.join("")}</div>`;
const g3 = (...a) => `<div class="g3">${a.join("")}</div>`;
const panel = (t, body, extra = "") => `<section class="panel"><h3>${t} ${extra}</h3>${body}</section>`;

function inp(label, path, o = {}) {
  let v = get(path); if (v == null) v = "";
  const hint = o.hint ? `<small>${o.hint}</small>` : "";
  const attrs = `data-path="${path}" ${o.title ? 'data-title="1"' : ""} ${o.dir ? `dir="${o.dir}"` : ""} placeholder="${esc(o.ph || "")}"`;
  if (o.type === "textarea" || o.type === "lines") {
    const val = o.type === "lines" ? (v || []).join("\n") : v;
    return `<label class="f"><span>${label}</span><textarea ${attrs} ${o.type === "lines" ? 'data-type="lines"' : ""} rows="${o.rows || 3}">${esc(val)}</textarea>${hint}</label>`;
  }
  if (o.type === "number") return `<label class="f"><span>${label}</span><input type="number" step="any" data-type="num" ${attrs} value="${esc(v)}">${hint}</label>`;
  return `<label class="f"><span>${label}</span><input type="text" ${attrs} value="${esc(v)}">${hint}</label>`;
}
function range(label, path, min, max, step, unit) {
  const v = get(path);
  return `<label class="f"><span>${label}<b class="rv">${v}${unit}</b></span><input type="range" min="${min}" max="${max}" step="${step}" data-type="num" data-unit="${unit}" data-path="${path}" value="${v}"></label>`;
}
function color(label, path) {
  const v = get(path) || "#000000";
  return `<label class="f"><span>${label}</span><div class="color"><input type="color" data-path="${path}" value="${esc(v)}"><input type="text" dir="ltr" data-path="${path}" value="${esc(v)}"></div></label>`;
}
function sel(label, path, opts) {
  const v = get(path);
  return `<label class="f"><span>${label}</span><select data-path="${path}">${opts.map(o => `<option value="${esc(o.v)}" ${o.v === v ? "selected" : ""}>${esc(o.l)}</option>`).join("")}</select></label>`;
}
const chk = (label, path) => `<label class="chk"><input type="checkbox" data-path="${path}" ${get(path) !== false ? "checked" : ""}><span>${label}</span></label>`;
function imgField(label, path, hint) {
  const v = get(path) || "", isData = v.startsWith("data:");
  return `<div class="f"><span>${label}</span><div class="img-row">
${v ? `<img class="thumb" src="${esc(v)}" alt="">` : `<div class="thumb empty">بدون صورة</div>`}
<div class="img-ctrl"><input type="text" dir="ltr" data-path="${path}" value="${isData ? "" : esc(v)}" placeholder="${isData ? "✓ صورة مرفوعة (اكتب رابط لاستبدالها)" : "https://... رابط الصورة"}">
<div class="row"><label class="btn sm">⬆ رفع صورة<input type="file" accept="image/*" data-upload="${path}" hidden></label>${v ? `<button class="btn sm danger" data-clear="${path}">حذف الصورة</button>` : ""}</div></div></div>${hint ? `<small>${hint}</small>` : ""}</div>`;
}
function logoField() {
  const v = cfg.logo.image;
  return `<div class="logo-up">
<div class="logo-prev">${v ? `<img src="${esc(v)}" alt="logo">` : "<span>لا يوجد شعار بعد</span>"}</div>
<div class="logo-ctrl">
${chk("إزالة الخلفية البيضاء تلقائياً (فعّلها قبل الرفع)", "logo.removeWhite")}
<div class="row"><label class="btn primary">⬆ ${v ? "تبديل الشعار" : "رفع الشعار"}<input type="file" accept="image/*" data-upload-logo hidden></label>${v ? '<button class="btn danger" data-clear-logo data-confirm>حذف الشعار</button>' : ""}</div>
<small class="hint">PNG أو JPG، مربع ويُفضّل 500×500 بكسل أو أكبر. الشعار يُضغط ويُدمج داخل الموقع، ويُستعمل زادة كأيقونة للمتصفح (Favicon).</small>
</div></div>`;
}
function item(list, i, title, meta, body, off) {
  const key = list + "." + i;
  return `<details class="item" data-key="${key}" ${openSet.has(key) ? "open" : ""}>
<summary><b>${esc(title) || "—"}</b>${off ? '<span class="off">مخفي</span>' : ""}${meta ? `<span class="meta">${esc(meta)}</span>` : ""}
<span class="acts"><button data-act="up" data-list="${list}" data-i="${i}" title="تحريك للأعلى">↑</button><button data-act="down" data-list="${list}" data-i="${i}" title="تحريك للأسفل">↓</button><button data-act="dup" data-list="${list}" data-i="${i}" title="نسخ">⧉</button><button class="danger" data-act="del" data-list="${list}" data-i="${i}" data-confirm title="حذف">✕</button></span></summary>
<div class="item-body">${body}</div></details>`;
}
const addBtn = (list, label) => `<button class="btn add" data-add="${list}">＋ ${label}</button>`;
const rowItem = (list, i, path, ph) => `<div class="row-item"><input type="text" data-path="${path}" value="${esc(get(path))}" placeholder="${ph}"><span class="acts"><button data-act="up" data-list="${list}" data-i="${i}">↑</button><button class="danger" data-act="del" data-list="${list}" data-i="${i}" data-confirm>✕</button></span></div>`;
const sectionHead = k => inp("نص صغير فوق العنوان", `sections.${k}.eyebrow`) + g3(inp("العنوان - قبل", `sections.${k}.t1`), inp("الكلمة الملوّنة ✨", `sections.${k}.hl`), inp("العنوان - بعد", `sections.${k}.t2`)) + inp("الوصف تحت العنوان", `sections.${k}.sub`, { type: "textarea", rows: 2 });

      ${g2(inp("الاسم", `payments.${i}.name`, { title: true }), inp("نص/رمز الشعار", `payments.${i}.logo`, { hint: "يظهر إذا لم ترفع صورة" }))}
      ${inp("الوصف", `payments.${i}.desc`, { type: "textarea", rows: 2 })}
      ${g3(color("لون الشعار 1", `payments.${i}.c1`), color("لون الشعار 2", `payments.${i}.c2`), color("لون النص", `payments.${i}.fg`))}
      ${imgField("صورة الشعار (اختياري)", `payments.${i}.image`)}`)).join("") + addBtn("payments", "إضافة طريقة دفع")) +
    panel("🛡️ شريط الضمانات", cfg.trust.map((t, i) => rowItem("trust", i, `trust.${i}`, "نص الضمان")).join("") + addBtn("trust", "إضافة ضمان")) },

  faq: { ic: "❓", t: "الأسئلة الشائعة", r: () =>
    panel("📝 عنوان القسم", sectionHead("faq")) +
    panel("❓ الأسئلة", cfg.faq.map((f, i) => item("faq", i, f.q, "", inp("السؤال", `faq.${i}.q`, { title: true }) + inp("الجواب", `faq.${i}.a`, { type: "textarea", rows: 3 }))).join("") + addBtn("faq", "إضافة سؤال")) },

  cta: { ic: "📣", t: "بانر الدعوة", r: () =>
    panel("📣 البانر قبل الفوتر", inp("العنوان", "cta.title") + inp("النص", "cta.text", { type: "textarea", rows: 2 }) + inp("نص الزر", "cta.btn")) }
};

/* ==========================================================
   7. RENDERING & STATE
   ========================================================== */
let currentTab = "logo";
const editor = $("#editor"), frame = $("#frame");

function renderSide() {
  const side = $("#side"), foot = side.querySelector(".side-foot");
  side.querySelectorAll(".tab").forEach(t => t.remove());
  Object.entries(TABS).forEach(([k, t]) => {
    const b = document.createElement("button");
    b.className = "tab" + (k === currentTab ? " active" : "");
    b.innerHTML = `<span>${t.ic}</span>${t.t}`;
    b.onclick = () => { currentTab = k; renderSide(); renderTab(); editor.parentElement.scrollTop = 0; };
    side.insertBefore(b, foot);
  });
}
function renderTab() { $("#tabTitle").textContent = TABS[currentTab].t; editor.innerHTML = TABS[currentTab].r(); }

let pvTimer, saveTimer;
function updatePreview() {
  let y = 0; try { y = frame.contentWindow.scrollY; } catch (e) {}
  frame.onload = () => { try { frame.contentWindow.scrollTo({ top: y, behavior: "instant" }); } catch (e) {} };
  frame.srcdoc = buildSite(cfg, true);
}
function changed() {
  clearTimeout(pvTimer); pvTimer = setTimeout(updatePreview, 400);
  clearTimeout(saveTimer); saveTimer = setTimeout(persist, 800);
  $("#status").textContent = "• تعديلات جديدة";
}

const STORE_KEY = "digitn-admin-config";
const hasStore = () => typeof window.storage !== "undefined" && window.storage && window.storage.set;
async function persist() {
  if (!hasStore()) { $("#status").textContent = "💡 احفظ «نسخة احتياطية» للاحتفاظ بالتعديلات"; return; }
  try { await window.storage.set(STORE_KEY, JSON.stringify(cfg), false); $("#status").textContent = "✓ محفوظ تلقائياً"; }
  catch (e) { $("#status").textContent = "⚠ تعذر الحفظ التلقائي — استعمل النسخة الاحتياطية"; }
}
async function loadSaved() {
  if (!hasStore()) return;
  try { const r = await window.storage.get(STORE_KEY, false); if (r && r.value) { cfg = merge(DEFAULTS, JSON.parse(r.value)); $("#status").textContent = "✓ تم استرجاع آخر تعديلات"; } } catch (e) {}
}

/* ==========================================================
   8. LOGO PROCESSING — removes the white background around the logo
   (flood-fill from the edges only, so white parts INSIDE the logo stay)
   ========================================================== */
function removeEdgeWhite(ctx, w, h) {
  const d = ctx.getImageData(0, 0, w, h), p = d.data, seen = new Uint8Array(w * h), st = [];
  const isBg = i => { const r = p[i * 4], g = p[i * 4 + 1], b = p[i * 4 + 2], mn = Math.min(r, g, b), mx = Math.max(r, g, b); return p[i * 4 + 3] < 10 || (mn >= 222 && mx - mn < 35); };
  for (let x = 0; x < w; x++) { st.push(x, (h - 1) * w + x); }
  for (let y = 0; y < h; y++) { st.push(y * w, y * w + w - 1); }
  while (st.length) {
    const i = st.pop(); if (seen[i]) continue; seen[i] = 1;
    if (!isBg(i)) continue;
    p[i * 4 + 3] = 0;
    const x = i % w, y = (i / w) | 0;
    if (x > 0) st.push(i - 1); if (x < w - 1) st.push(i + 1);
    if (y > 0) st.push(i - w); if (y < h - 1) st.push(i + w);
  }
  /* soften the edge: light pixels touching the removed area become semi-transparent */
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x; if (p[i * 4 + 3] === 0) continue;
    const near = p[(i - 1) * 4 + 3] === 0 || p[(i + 1) * 4 + 3] === 0 || p[(i - w) * 4 + 3] === 0 || p[(i + w) * 4 + 3] === 0;
    if (!near) continue;
    const mn = Math.min(p[i * 4], p[i * 4 + 1], p[i * 4 + 2]);
    if (mn > 170) p[i * 4 + 3] = Math.round(Math.max(0, Math.min(255, (255 - mn) / 85 * 255)));
  }
  ctx.putImageData(d, 0, 0);
}
function processLogo(file) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 640, s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      const ctx = cv.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      if (cfg.logo.removeWhite) removeEdgeWhite(ctx, cv.width, cv.height);
      let url = cv.toDataURL("image/webp", 0.9);
      if (!url.startsWith("data:image/webp")) url = cv.toDataURL("image/png");
      const fv = document.createElement("canvas"); fv.width = fv.height = 96;
      const fs = Math.min(96 / cv.width, 96 / cv.height);
      fv.getContext("2d").drawImage(cv, (96 - cv.width * fs) / 2, (96 - cv.height * fs) / 2, cv.width * fs, cv.height * fs);
      cfg.logo.image = url;
      cfg.logo.favicon = fv.toDataURL("image/png");
      cfg.logo.ratio = +(cv.width / cv.height).toFixed(3);
      renderTab(); changed();
      toast("✓ تم رفع الشعار (" + Math.round(url.length * 0.75 / 1024) + " KB)");
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* ==========================================================
   9. EVENTS
   ========================================================== */
function onField(e) {
  const el = e.target, p = el.dataset.path; if (!p) return;
  let v;
  if (el.type === "checkbox") v = el.checked;
  else if (el.dataset.type === "num") v = el.value === "" ? "" : Number(el.value);
  else if (el.dataset.type === "lines") v = el.value.split("\n");
  else v = el.value;
  set(p, v);
  if (el.type === "range") { const rv = el.closest(".f").querySelector(".rv"); if (rv) rv.textContent = v + (el.dataset.unit || ""); }
  const cw = el.closest(".color"); if (cw) cw.querySelectorAll("input").forEach(i => { if (i !== el) i.value = v; });
  const det = el.closest("details.item"); if (det && el.dataset.title) det.querySelector("summary b").textContent = v || "—";
  changed();
}
editor.addEventListener("input", onField);
editor.addEventListener("change", e => {
  const t = e.target;
  if (t.type === "checkbox" || t.tagName === "SELECT") onField(e);
  if (t.hasAttribute("data-upload-logo") && t.files[0]) { processLogo(t.files[0]); t.value = ""; return; }
  const up = t.dataset.upload; if (up && t.files[0]) uploadImage(t.files[0], up);
});
editor.addEventListener("toggle", e => {
  const d = e.target; if (!d.dataset || !d.dataset.key) return;
  d.open ? openSet.add(d.dataset.key) : openSet.delete(d.dataset.key);
}, true);

function armed(btn) {
  if (!btn.hasAttribute("data-confirm")) return true;
  if (btn.dataset.armed === "1") return true;
  btn.dataset.armed = "1"; btn.classList.add("armed");
  const old = btn.innerHTML; const big = btn.id || btn.hasAttribute("data-clear-logo");
  if (big) btn.innerHTML = "اضغط مرة أخرى للتأكيد";
  setTimeout(() => { btn.dataset.armed = ""; btn.classList.remove("armed"); if (big) btn.innerHTML = old; }, 2500);
  return false;
}

editor.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.closest("summary")) e.preventDefault();
  if (b.hasAttribute("data-clear-logo")) {
    if (!armed(b)) return;
    cfg.logo.image = ""; cfg.logo.favicon = ""; cfg.logo.ratio = 1; renderTab(); changed(); return;
  }
  if (b.dataset.add) {
    const a = get(b.dataset.add); a.push(NEW[b.dataset.add]());
    openSet.add(b.dataset.add + "." + (a.length - 1)); renderTab(); changed(); return;
  }
  if (b.dataset.clear) { set(b.dataset.clear, ""); renderTab(); changed(); return; }
  if (b.dataset.act) {
    if (!armed(b)) return;
    const list = b.dataset.list, a = get(list), i = +b.dataset.i, act = b.dataset.act;
    openSet.clear();
    if (act === "del") a.splice(i, 1);
    else if (act === "up" && i > 0) { [a[i - 1], a[i]] = [a[i], a[i - 1]]; openSet.add(list + "." + (i - 1)); }
    else if (act === "down" && i < a.length - 1) { [a[i + 1], a[i]] = [a[i], a[i + 1]]; openSet.add(list + "." + (i + 1)); }
    else if (act === "dup") { a.splice(i + 1, 0, clone(a[i])); openSet.add(list + "." + (i + 1)); }
    renderTab(); changed();
  }
});

function uploadImage(file, path) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      let url = cv.toDataURL("image/webp", 0.82);
      if (!url.startsWith("data:image/webp")) url = cv.toDataURL("image/jpeg", 0.85);
      set(path, url); renderTab(); changed();
      toast("✓ تم رفع الصورة (" + Math.round(url.length * 0.75 / 1024) + " KB)");
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function downloadFile(name, content, type) {
  try {
    const blob = new Blob([content], { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    return true;
  } catch (e) { return false; }
}
$("#btnDownload").onclick = () => {
  const html = buildSite(cfg, false);
  if (downloadFile("index.html", html, "text/html;charset=utf-8")) toast("✓ تم تحميل index.html — ارفعه على GitHub");
  else openCode(html);
};
$("#btnCopy").onclick = () => openCode(buildSite(cfg, false));
function openCode(html) { $("#codeOut").value = html; $("#codeModal").classList.add("open"); }
$("#modalClose").onclick = () => $("#codeModal").classList.remove("open");
$("#modalCopy").onclick = async () => {
  const ta = $("#codeOut");
  try { await navigator.clipboard.writeText(ta.value); }
  catch (e) { ta.select(); document.execCommand("copy"); }
  toast("✓ تم نسخ الكود");
};
$("#btnExport").onclick = () => {
  downloadFile("digital-abonnement-settings.json", JSON.stringify(cfg, null, 2), "application/json")
    ? toast("✓ تم حفظ النسخة الاحتياطية") : openCode(JSON.stringify(cfg, null, 2));
};
$("#btnImport").onclick = () => $("#importFile").click();
$("#importFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { cfg = merge(DEFAULTS, JSON.parse(r.result)); openSet.clear(); renderTab(); changed(); toast("✓ تم استيراد الإعدادات"); }
    catch (err) { toast("⚠ الملف غير صالح"); }
  };
  r.readAsText(f); e.target.value = "";
};
$("#btnReset").onclick = e => {
  if (!armed(e.currentTarget)) return;
  cfg = clone(DEFAULTS); openSet.clear(); renderTab(); changed(); toast("↺ تمت إعادة الضبط");
};

const work = $("#work"), pv = $("#preview");
function setPreview(on) { work.classList.toggle("no-preview", !on); if (on) updatePreview(); }
$("#btnPreview").onclick = () => setPreview(work.classList.contains("no-preview"));
$("#pvClose").onclick = () => setPreview(false);
document.querySelectorAll("[data-device]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-device]").forEach(x => x.classList.toggle("on", x === b));
  pv.classList.toggle("mobile", b.dataset.device === "mobile");
});

(async function init() {
  await loadSaved();
  renderSide(); renderTab();
  setPreview(window.innerWidth > 1050);
  if (!hasStore()) $("#status").textContent = "💡 احفظ «نسخة احتياطية» للاحتفاظ بالتعديلات";
})();
</script>
